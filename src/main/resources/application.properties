spring.application.name=VietFly
spring.config.import=optional:classpath:application-local.properties

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vietfly}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DATA_PASSWORD:}

spring.jpa.open-in-view=false
#spring.jpa.hibernate.ddl-auto = create
#spring.jpa.hibernate.ddl-auto = update
#spring.jpa.hibernate.ddl-auto = create-drop

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans = true

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.company.email=${COMPANY_EMAIL:${EMAIL:}}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}
app.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m

# Google Weather API: intentionally empty until a registered key is provided.
app.weather.google.api-key=${GOOGLE_WEATHER_API_KEY:}
# Once daily at 06:00 Vietnam time; restarting does not trigger extra requests.
app.weather.cron=0 0 6 * * *
app.mail.from=${MAIL_FROM:${EMAIL:}}
